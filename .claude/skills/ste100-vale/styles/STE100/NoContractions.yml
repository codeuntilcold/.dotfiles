# STE-4.2 forbids shortening a sentence by dropping words, and a contraction is
# the most common form of that. Only true contractions are listed: a bare `'s`
# is left alone because it is ambiguous with the possessive, which GR-8 allows.
# The list covers the common cases, it is not exhaustive.
extends: substitution
message: "Do not use contractions: use '%s' instead of '%s' (STE-4.2)."
level: error
ignorecase: true
swap:
  "isn['’]t": is not
  "aren['’]t": are not
  "wasn['’]t": was not
  "weren['’]t": were not
  "doesn['’]t": does not
  "don['’]t": do not
  "didn['’]t": did not
  "can['’]t": cannot
  "won['’]t": will not
  "wouldn['’]t": would not
  "shouldn['’]t": should not
  "couldn['’]t": could not
  "hasn['’]t": has not
  "haven['’]t": have not
  "hadn['’]t": had not
  "it['’]s": it is
  "that['’]s": that is
  "there['’]s": there is
  "here['’]s": here is
  "let['’]s": let us
  "you['’]re": you are
  "we['’]re": we are
  "they['’]re": they are
  "you['’]ll": you will
  "we['’]ll": we will
  "it['’]ll": it will
  "they['’]ll": they will
  "i['’]m": I am
  "i['’]ve": I have
  "you['’]ve": you have
  "we['’]ve": we have
  "they['’]ve": they have
